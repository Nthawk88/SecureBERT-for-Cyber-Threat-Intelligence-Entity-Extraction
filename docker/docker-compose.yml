# =============================================================================
# Neo4j Community Edition for visualising the IoC correlation graph (Phase 3).
# Run from the docker/ directory:   docker compose up -d
# Browser UI:  http://localhost:7474   (bolt: bolt://localhost:7687)
# Credentials must match config/config.yaml -> correlation.neo4j
# =============================================================================
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: cti-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      # username is fixed to "neo4j"; password set here must match config.yaml
      NEO4J_AUTH: "neo4j/ctiresearch"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
